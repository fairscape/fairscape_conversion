# Keep Cromwell's noise down and its execution root inside this example.
include required(classpath("application"))

backend {
  default = "Local"
  providers.Local.config {
    # Symlink localized inputs instead of copying them: the reads are 18 MB
    # and every scatter shard would otherwise get its own copy.
    localization = ["soft-link", "hard-link", "copy"]
    root = "cromwell-executions"
  }
}

call-caching.enabled = true
workflow-options.workflow-log-dir = "cromwell-workflow-logs"
